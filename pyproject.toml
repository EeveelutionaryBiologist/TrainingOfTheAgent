[project]
name = "bota-harness"
version = "0.2.0"
description = "Environment harness for The Binding of the Agent: headless game workers behind a Gymnasium vector API"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "gymnasium>=1.1",
    "numpy>=2.0",
]

[project.scripts]
bota-harness = "bota_harness.cli:main"
bota-agent = "bota_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bota_harness", "src/bota_agent"]

# The Node side travels inside the wheel. An editable install uses the repo's js/ folder instead.
[tool.hatch.build.targets.wheel.force-include]
"js/core" = "bota_harness/_js/core"
"js/node" = "bota_harness/_js/node"
"js/viewer" = "bota_harness/_js/viewer"
"package.json" = "bota_harness/package.json"
"scenarios" = "bota_harness/_scenarios"
"evals" = "bota_agent/_evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
